name: Auto Update Articles List

on:
  push:
    branches: ["main"]
    paths:
      - '_posts/**'

permissions:
  contents: write

jobs:
  update-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Rebuild Articles List in index.html
        run: |
          # Generate <li> HTML links for all files in _posts/
          ARTICLES_HTML=""
          for file in _posts/*.html; do
            if [ -f "$file" ]; then
              # Extract title from <title> tag, or fallback to filename
              TITLE=$(grep -i -o '<title>[^<]*' "$file" | sed 's/<title>//I' || echo "$file")
              ARTICLES_HTML="${ARTICLES_HTML}    <li><a href=\"${file}\">${TITLE}</a></li>\n"
            fi
          done

          # Replace content between ARTICLES_START and ARTICLES_END
          awk -v list="$ARTICLES_HTML" '
            /<!-- ARTICLES_START -->/ {
              print $0
              printf "%s", list
              skip=1
              next
            }
            /<!-- ARTICLES_END -->/ {
              skip=0
            }
            !skip { print }
          ' index.html > temp.html && mv temp.html index.html

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet index.html; then
            git add index.html
            git commit -m "chore: auto-update articles list [skip ci]"
            git push
          fi
