name: Auto Update Articles on New Post

on:
  push:
    paths:
      - 'posts/*.html'
    branches: ["main"]

permissions:
  contents: write

jobs:
  update-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect New Post and Update index.html
        run: |
          # Find the most recently added HTML file in posts/
          NEW_FILE=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | grep '^posts/.*\.html$' | head -n 1)

          if [ -z "$NEW_FILE" ]; then
            echo "No new article file detected."
            exit 0
          fi

          # Extract title from <title> tag or default to filename
          TITLE=$(grep -i -o '<title>.*</title>' "$NEW_FILE" | sed 's/<\/\?[^>]*>//g' | sed 's/ — Ayon//g' | sed 's/ - Ayon//g')
          
          if [ -z "$TITLE" ]; then
            FILENAME=$(basename "$NEW_FILE" .html)
            TITLE=$(echo "$FILENAME" | sed 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//' | tr '_' ' ' | tr '-' ' ')
          fi

          # Format new HTML link entry
          NEW_ENTRY="    <li><a href=\"${NEW_FILE}\">${TITLE}</a></li>"

          # Insert the entry directly after <!-- ARTICLES_START -->
          awk -v entry="$NEW_ENTRY" '
            /<!-- ARTICLES_START -->/ {
              print $0
              print entry
              next
            }
            { print }
          ' index.html > temp.html && mv temp.html index.html

          # Commit updated index.html back to repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: auto-add new article link [skip ci]" || exit 0
          git push
